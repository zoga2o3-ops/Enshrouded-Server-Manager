<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src http://127.0.0.1:*">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Enshrouded Server Manager</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="banner">
      <div class="banner-title">
        <img class="brand-mark-img" src="assets/icon.png" alt="">

        <h1>Enshrouded Server Manager</h1>
      </div>
    </header>

    <main class="main">
      <div class="content" id="view"></div>
    </main>

    <nav class="bottom-nav" aria-label="Main">
      <div class="nav">
        <a href="#/servers" data-nav="servers"><span class="nav-icon" data-icon="grid"></span><span class="nav-text">Servers</span></a>
        <a href="#/add" data-nav="add"><span class="nav-icon" data-icon="plus"></span><span class="nav-text">Add Server</span></a>
        <a href="#/settings" data-nav="settings"><span class="nav-icon" data-icon="settings"></span><span class="nav-text">Settings</span></a>
      </div>
      <div class="bottom-foot">
        <button class="icon-btn" id="theme-toggle" title="Toggle theme"><span data-icon="moon"></span></button>
        <div class="foot-text">
          <div class="foot-name">v0.9.2</div>
        </div>
      </div>
    </nav>
  </div>

  <div id="modal-root"></div>
  <div class="toasts" id="toasts"></div>
  <script src="app.js"></script>
</body>
</html>
